name: munasakna_mobile
description: Independent Manasikuna companion for Hajj and Umrah journeys.
publish_to: 'none'
version: 2.10.0+39

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.20.2
  geolocator: ^13.0.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.5
  flutter_tts: ^4.2.5
  speech_to_text: ^7.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
